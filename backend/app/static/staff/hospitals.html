<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SahayAI Partner Hospitals & Emergency Trauma Centers">
  <title>SahayAI — Hospitals &amp; Beds | Dispatch Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/staff.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="staffSidebar"></aside>

    <div class="main-wrapper">
      <header class="top-bar">
        <div class="top-bar-title">
          <span>🏥</span>
          <span>Emergency Hospitals &amp; Bed Capacity</span>
        </div>

        <div class="top-bar-actions">
          <button class="btn btn-outline btn-sm" id="btnRefreshHospitals">🔄 Refresh Beds</button>
          <a href="/staff/map" class="btn btn-outline btn-sm">🗺️ View on Map</a>
        </div>
      </header>

      <main class="content-area">

        <!-- Filters Bar -->
        <div class="card" style="margin-bottom:20px; padding:16px 20px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
            <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
              <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem; color:var(--text-secondary); cursor:pointer;">
                <input type="checkbox" id="filterTraumaOnly"> 🚨 Trauma Centers Only
              </label>
              <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem; color:var(--text-secondary); cursor:pointer;">
                <input type="checkbox" id="filterCardiacOnly"> 🫀 Cardiac Care Only
              </label>
              <label style="display:flex; align-items:center; gap:6px; font-size:0.85rem; color:var(--text-secondary); cursor:pointer;">
                <input type="checkbox" id="filterBurnOnly"> 🔥 Burn Units Only
              </label>
            </div>

            <div id="hospitalStatsLabel" style="font-weight:700; color:var(--accent-emerald); font-size:0.86rem;">
              Loading hospital stats…
            </div>
          </div>
        </div>

        <!-- Hospitals Grid -->
        <div id="hospitalsGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:16px;"></div>

      </main>
    </div>
  </div>

  <script src="/static/js/core/api.js"></script>
  <script src="/static/js/core/auth.js"></script>
  <script src="/static/js/core/utils.js"></script>
  <script src="/static/js/staff/hospitals.js"></script>
</body>
</html>
