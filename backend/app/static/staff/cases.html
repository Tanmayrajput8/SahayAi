<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SahayAI Emergency Cases — Full Operational Registry">
  <title>SahayAI — Emergency Cases | Dispatch Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/staff.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="staffSidebar"></aside>

    <div class="main-wrapper">
      <header class="top-bar">
        <div class="top-bar-title">
          <span>📋</span>
          <span>Emergency Cases Registry</span>
        </div>

        <div class="top-bar-actions">
          <button class="btn btn-outline btn-sm" id="btnRefreshCases">🔄 Refresh</button>
          <a href="/staff/dashboard" class="btn btn-outline btn-sm">← Back to Dashboard</a>
        </div>
      </header>

      <main class="content-area">

        <!-- Filters Bar -->
        <div class="card" style="margin-bottom:20px; padding:16px 20px;">
          <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap; justify-content:space-between;">
            <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap; flex:1;">
              <div style="min-width:200px;">
                <input type="text" id="searchCaseQuery" class="form-control" placeholder="Search by ID, caller, location, symptom…" style="padding:8px 12px; font-size:0.85rem;">
              </div>

              <div>
                <select id="filterCaseStatus" class="form-control" style="padding:8px 12px; font-size:0.85rem;">
                  <option value="">All Statuses</option>
                  <option value="PENDING">PENDING</option>
                  <option value="TRIAGED">TRIAGED</option>
                  <option value="UNDER_REVIEW">UNDER REVIEW</option>
                  <option value="DISPATCHED">DISPATCHED</option>
                  <option value="RESOLVED">RESOLVED</option>
                  <option value="CANCELLED">CANCELLED</option>
                </select>
              </div>
            </div>

            <div id="casesCountLabel" style="font-size:0.82rem; color:var(--text-secondary); font-weight:600;">
              Loading cases…
            </div>
          </div>
        </div>

        <!-- Cases Table Card -->
        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Case ID</th>
                  <th>Created</th>
                  <th>Location</th>
                  <th>Condition</th>
                  <th>Priority</th>
                  <th>Ambulance</th>
                  <th>Confidence</th>
                  <th>Status</th>
                  <th>SLA</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="casesTableBody">
                <tr>
                  <td colspan="10" style="text-align:center; padding:32px;">
                    <span class="spinner"></span>
                    <div style="margin-top:8px; color:var(--text-muted);">Loading emergency cases…</div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="/static/js/core/api.js"></script>
  <script src="/static/js/core/auth.js"></script>
  <script src="/static/js/core/utils.js"></script>
  <script src="/static/js/staff/cases.js"></script>
</body>
</html>
