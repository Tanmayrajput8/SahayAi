<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SahayAI Live Fleet & Hospital Spatial Telemetry Map">
  <title>SahayAI — Live Map | Dispatch Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/staff.css">
  <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="staffSidebar"></aside>

    <div class="main-wrapper">
      <header class="top-bar">
        <div class="top-bar-title">
          <span>🗺️</span>
          <span>Pune Regional Fleet &amp; Emergency Map</span>
        </div>

        <div class="top-bar-actions">
          <div style="display:flex; align-items:center; gap:8px;">
            <label style="font-size:0.78rem; color:var(--text-muted); font-weight:600;">Focus Incident:</label>
            <select id="selectFocusCase" class="form-control" style="padding:6px 10px; font-size:0.8rem; width:220px;">
              <option value="">All Incidents &amp; Fleet</option>
            </select>
          </div>
          <button class="btn btn-outline btn-sm" id="btnRefreshMap">🔄 Refresh Map</button>
        </div>
      </header>

      <main class="content-area" style="padding:16px;">
        <div id="mapFocusBanner" class="alert alert-info" style="display:none; margin-bottom:12px;"></div>
        <div id="staffMapViewport" class="map-viewport" style="height:calc(100vh - var(--header-h) - 40px);"></div>
      </main>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/js/core/api.js"></script>
  <script src="/static/js/core/auth.js"></script>
  <script src="/static/js/core/utils.js"></script>
  <script src="/static/js/staff/map.js"></script>
</body>
</html>
